name: ChaosStrap WinGet

on:
  workflow_call:
    inputs:
      version:
        description: "ChaosStrap release version"
        required: true
        type: string
      package_id:
        description: "Existing WinGet package identifier"
        required: true
        type: string
    secrets:
      WINGET_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Download WinGetCreate
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://aka.ms/wingetcreate/latest" `
            -OutFile "wingetcreate.exe"

      - name: Submit WinGet update
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = "${{ inputs.version }}".TrimStart("v")
          $packageId = "${{ inputs.package_id }}"
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/v$version/ChaosStrap-Setup-$version-win-x64.exe"

          if ([string]::IsNullOrWhiteSpace($packageId)) {
            throw "A WinGet package identifier is required."
          }

          .\wingetcreate.exe update $packageId `
            --version $version `
            --urls "$installerUrl|x64" `
            --submit `
            --no-open

          if ($LASTEXITCODE -ne 0) {
            throw "WinGet submission failed."
          }
